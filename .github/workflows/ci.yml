name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

jobs:
  preflight-and-test:
    name: Preflight & Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rust-toolchain.toml (channel = "stable") is picked up automatically,
      # but we list targets explicitly here so the action installs them
      # even on runners where rustup home may differ. We don't pin a host
      # toolchain suffix, so on windows-latest this resolves to rustup's
      # default host, x86_64-pc-windows-msvc -- see the Windows note below.
      - name: Install Rust toolchain with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      # Caches the registry index, downloaded crates, and build artifacts
      # keyed on Cargo.lock, so a matrix re-run (or a later CI run with an
      # unchanged lockfile) doesn't recompile the full soroban-sdk dependency
      # tree on every OS. Keeps the 3x runner count from tripling wall-clock
      # or billed compile time on repeat runs.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # Linux/macOS run the bash script directly. Windows runs the
      # PowerShell equivalent (scripts/ci_preflight_check.ps1) as
      # first-class tooling rather than relying on the runner's bundled Git
      # Bash -- see CONTRIBUTING.md for why both variants exist and are
      # kept in sync.
      - name: Run CI Preflight Check (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./scripts/ci_preflight_check.sh
          ./scripts/ci_preflight_check.sh

      - name: Run CI Preflight Check (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci_preflight_check.ps1

      # NOTE (Windows): earlier CI ran a bash-installed x86_64-pc-windows-gnu
      # toolchain, which hit "export ordinal too large" -- the soroban-sdk
      # test harness (testutils) generates more DLL exports than the PE/COFF
      # format allows on that target. windows-latest's default host toolchain
      # is x86_64-pc-windows-msvc (with Visual Studio Build Tools
      # preinstalled on the runner image), which uses a different linker and
      # export mechanism entirely, so it isn't subject to that ordinal
      # ceiling. Running the native suite here verifies that on every CI run
      # rather than assuming it. See docs/platform-quirks.md for the full
      # history, including the GNU-specific quirk for local Windows/MinGW
      # setups.
      - name: Run Cargo Tests
        run: cargo test

      # Same lint set as the local pre-commit hook (see .pre-commit-config.yaml)
      # so a PR can't merge with a clippy warning that just wasn't caught
      # locally. -D warnings promotes every warning to a hard failure.
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build deployable contract (wasm32v1-none)
        run: cargo build --target wasm32v1-none --release

  # Run a short fuzzing budget on every PR and push to catch regressions early.
  # Longer fuzzing runs are available via a manual workflow (fuzz-long.yml).
  fuzz-short:
    name: Fuzzing (short budget)
    runs-on: ubuntu-latest
    # Only run on linux to save CI minutes; fuzzing is platform-independent
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzzing

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz_attest_args (60 seconds)
        # cargo-fuzz resolves its `fuzz/` directory relative to the crate
        # root it's invoked from, so running it from inside `./fuzz` itself
        # makes it look for a nonexistent `./fuzz/fuzz/Cargo.toml`. Run from
        # the repo root instead, same as a local `cargo fuzz run` invocation.
        #
        # `+nightly` is required here: rust-toolchain.toml pins "stable" for
        # this repo, which rustup's toolchain resolution honors over the
        # nightly install above for any bare `cargo`/`rustc` invocation, and
        # cargo-fuzz's sanitizer build needs nightly-only `-Z` flags.
        run: cargo +nightly fuzz run fuzz_attest_args -- -max_total_time=60

      - name: Run fuzz_revoke_args (60 seconds)
        run: cargo +nightly fuzz run fuzz_revoke_args -- -max_total_time=60

  # ---------------------------------------------------------------------------
  # dependency-audit: check for known security vulnerabilities and license
  # issues in dependencies using cargo-deny and cargo-audit.
  #
  # Runs on every PR that touches Cargo.toml or Cargo.lock files.
  # Fails on critical/high security advisories.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Security & License Audit
    runs-on: ubuntu-latest
    # Only run on PRs and when Cargo files have potentially changed
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny checks
        run: cargo deny check advisories licenses bans sources

      - name: Run cargo audit
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # wasm-artifact: build the optimized release wasm, report its size in the
  # job summary, and upload it as a downloadable build artifact.
  #
  # Runs on every push to main and on every version tag (v*) so that both
  # trunk builds and release builds produce a downloadable artifact.
  # Only runs on ubuntu-latest — wasm32v1-none is a cross-compile target and
  # the output is platform-independent, so a single runner is sufficient.
  # ---------------------------------------------------------------------------
  wasm-artifact:
    name: Build & upload release wasm artifact
    runs-on: ubuntu-latest
    # Only on pushes (not PRs) — avoids uploading artifacts for every draft PR
    # while still catching every merge to main and every release tag.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # Keyed separately from the test-matrix cache (shared-key: ubuntu-latest)
      # so a wasm release build never evicts or collides with a test-debug build.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release

      # Build with the [profile.release] settings already in Cargo.toml:
      #   opt-level = "z"  (size-optimised)
      #   lto = true       (link-time optimisation across all crates)
      #   strip = true     (strips debug symbols from the output binary)
      #   codegen-units = 1 (maximises LTO effectiveness)
      # This is the same command documented in README.md and used locally.
      - name: Build release wasm (wasm32v1-none)
        run: cargo build --target wasm32v1-none --release

      # Report the artifact size in the job summary so reviewers can see size
      # regressions at a glance without downloading the artifact.
      - name: Report wasm size in job summary
        shell: bash
        run: |
          WASM_PATH="target/wasm32v1-none/release/anchorkit.wasm"
          SIZE_BYTES=$(wc -c < "$WASM_PATH")
          SIZE_KB=$(echo "scale=2; $SIZE_BYTES / 1024" | bc)
          echo "### Wasm artifact size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`$WASM_PATH\` | ${SIZE_KB} KB (${SIZE_BYTES} bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built with \`--release\` profile: \`opt-level=z\`, \`lto=true\`, \`strip=true\`." >> "$GITHUB_STEP_SUMMARY"

      # Upload the wasm file so it can be downloaded from the Actions run page.
      # Retention is kept at the GitHub default (90 days).  The artifact name
      # includes the short SHA so builds from different commits are
      # distinguishable in the Actions UI.
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchorkit-${{ github.ref_name }}-${{ github.sha }}
          path: target/wasm32v1-none/release/anchorkit.wasm
          if-no-files-found: error
