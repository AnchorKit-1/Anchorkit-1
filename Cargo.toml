[workspace]
members = [".", "webhook-sdk", "cli", "fuzz"]
resolver = "2"

[package]
name = "anchorkit"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Gates the allow-list stress benchmark (see src/attestor_stress_tests.rs) so
# it doesn't run as part of a normal `cargo test`. Enable it explicitly with:
#   cargo test --release --features stress-tests allow_list_scaling -- --nocapture
stress-tests = []
# Gates the real-network end-to-end suite (see
# src/testnet_integration_tests.rs) so it never runs as part of a normal
# `cargo test` -- it needs a funded testnet account, network access, and a
# pre-built wasm artifact. Enable it explicitly with:
#   ANCHORKIT_TESTNET_SOURCE=<identity> cargo test --features testnet-integration testnet_integration -- --nocapture
testnet-integration = []

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
criterion = "0.5"
proptest = "1"

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
strip = true

# Benches run natively (`cargo bench`), never on the wasm32v1-none target, so
# this is tuned for fastest host execution rather than the on-chain build's
# wasm-size budget -- the opposite trade-off from [profile.release] above.
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false
overflow-checks = false
