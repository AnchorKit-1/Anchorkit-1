[advisories]
# db-path/db-urls are left at their defaults ($CARGO_HOME/advisory-dbs and
# the rustsec/advisory-db git repo) -- a git-repo clone, not a raw file URL.

# A list of advisory IDs to ignore. Use this when a vulnerability has been
# reviewed and determined to be false positive or not affecting this project.
# See https://rustsec.org/ for more information about the advisory database.
ignore = [
    # `paste` is unmaintained (not a vulnerability) and pulled in transitively
    # by soroban-env-host's own dependency tree (ark-ff, wasmi_core), not a
    # direct or upgradeable dependency of this crate. Matches this project's
    # original policy of warning rather than failing on unmaintained-only
    # advisories -- the newer cargo-deny schema folded that lint level into
    # `ignore` instead of a separate `unmaintained = "warn"` setting.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, transitive via soroban-env-host; no upgrade path available" },
]

[licenses]
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

# List of explicitly allowed licenses. Each dependency's own SPDX license
# expression (e.g. a dual "MIT OR Apache-2.0") is satisfied if any single
# identifier it names appears here -- compound expressions aren't listed as
# their own entries. Anything not satisfiable from this list is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# The graph highlighting used when creating dotgraphs
highlight = "all"

# List of explicitly disallowed duplicate crates
deny = [
    # Each entry can be just a crate name, or it can be a crate name and a semver version range.
    # If this is specified, dependencies must not be in the range.
    #{ crate = "ansi_term@0.11.0", reason = "you can specify a reason it is banned" }
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ crate = "ansi_term@0.11.0", reason = "you can specify a reason why it can't be updated/removed" }
]

# Similarly named crates that are allowed to coexist.
skip-tree = [
    #{ crate = "windows-sys@0.42.0" }
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is detected
unknown-registry = "warn"

# Lint level for what to happen when a crate from a git repository that is not in the allow list is detected
unknown-git = "warn"

# List of allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# List of allowed Git repositories
allow-git = []
