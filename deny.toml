[advisories]
# The advisory database URL defaults to the repository if not specified.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db/raw/main/db.json.gz"]

# The lint level for security vulnerabilities.
# * None - CVSS Score 0.0
# * Low - CVSS Score 0.1 - 3.9
# * Medium - CVSS Score 4.0 - 6.9
# * High - CVSS Score 7.0 - 8.9
# * Critical - CVSS Score 9.0 - 10.0
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
unsound = "warn"

# A list of advisory IDs to ignore. Use this when a vulnerability has been
# reviewed and determined to be false positive or not affecting this project.
# See https://rustsec.org/ for more information about the advisory database.
ignore = [
    #{ id = "RUSTSEC-2020-0001", reason = "not vulnerable to X, requires Y" }
]

[licenses]
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 OR MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "MPL-2.0",
]

# List of explicitly disallowed licenses
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]

# Lint level for crates which do not have a detectable license
copyleft = "warn"

# Blanket approval or denial for OSI-approved or FSF Free/Libre licenses
allow-osi-fsf-free = true

# Lint level used when no other predicates are matched
default = "deny"

# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# Lint level for when an unmaintained crate is detected
unmaintained = "warn"

# Lint level for when an crate with security notices is detected
notice = "warn"

# The graph highlighting used when creating dotgraphs
highlight = "all"

# List of explicitly disallowed duplicate crates
deny = [
    # Each entry can be just a crate name, or it can be a crate name and a semver version range.
    # If this is specified, dependencies must not be in the range.
    #{ name = "ansi_term", version = "=0.11.0" }
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ name = "ansi_term", version = "=0.11.0" }
]

# Similarly named crates that are allowed to coexist.
skip-tree = [
    #{ name = "windows-sys", version = "=0.42.0" }
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is detected
unknown-registry = "warn"

# Lint level for what to happen when a crate from a git repository that is not in the allow list is detected
unknown-git = "warn"

# List of allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# List of allowed Git repositories
allow-git = []
